<!DOCTYPE html>
<html class="has-background-light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StoreEverything</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body>

<div th:replace="fragments/nav :: nav"></div>

<div class="container pt-6">
    <div class="columns">
        <div class="column">
            <div class="field has-addons">
                <form action="/information/by-me/sort" method="post" class="control">
                    <input type="hidden" name="ordering" value="created">
                    <input type="hidden" name="descending" value="false">
                    <input type="submit" value="Date ASC" class="button">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                </form>
                <form action="/information/by-me/sort" method="post" class="control">
                    <input type="hidden" name="ordering" value="created">
                    <input type="hidden" name="descending" value="true">
                    <input type="submit" value="Date DESC" class="button">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                </form>

                <form action="/information/by-me/sort" method="post" class="control">
                    <input type="hidden" name="ordering" value="category">
                    <input type="hidden" name="descending" value="false">
                    <input type="submit" value="Category ASC" class="button">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                </form>
                <form action="/information/by-me/sort" method="post" class="control">
                    <input type="hidden" name="ordering" value="category">
                    <input type="hidden" name="descending" value="true">
                    <input type="submit" value="Category DESC" class="button">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                </form>

                <form action="/information/by-me/sort" method="post" class="control">
                    <input type="hidden" name="ordering" value="title">
                    <input type="hidden" name="descending" value="false">
                    <input type="submit" value="Title ASC" class="button">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                </form>
                <form action="/information/by-me/sort" method="post" class="control">
                    <input type="hidden" name="ordering" value="title">
                    <input type="hidden" name="descending" value="true">
                    <input type="submit" value="Title DESC" class="button">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                </form>
            </div>
            <br>
            
            <div th:each="information: ${informations}" th:object="${information}" class="card mb-2">
                <div class="card-header">
                    <div th:text="*{title}?: 'No title'" class="card-header-title"></div>
                </div>
                <div class="card-content">
                    <div class="columns">
                        <div th:if="*{author}" class="field column is-narrow">
                            <label class="label">Author</label>
                            <p th:text="*{author.username}">
                        </div>
                        <div th:if="*{created}" class="field column is-narrow">
                            <label class="label">Date</label>
                            <p th:text="*{created}">
                        </div>
                        <div th:if="*{category}" class="field column is-narrow">
                            <label class="label">Category</label>
                            <p th:text="*{category.name}">
                        </div>
                    </div>
                    <div th:if="*{content}" class="field">
                        <label class="label">Content</label>
                        <p th:text="*{content}">
                    </div>
                    <div th:if="*{link}" class="field">
                        <label class="label">Link</label>
                        <a th:text="*{link}" th:href="*{link}"></a>
                    </div>
                    <div class="field">
                        <a class="button" th:href="@{/information/read/{id}(id=*{id})}">Read</a>
                        <a class="button" th:href="@{/information/edit/{id}(id=*{id})}">Edit</a>
                        <a class="button" th:href="@{/information/delete/{id}(id=*{id})}">Delete</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="column is-one-third">
            <div class="panel">
                <p class="panel-heading">
                    Shared with me
                </p>
                <div class="panel-block">

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
