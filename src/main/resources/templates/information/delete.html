<!DOCTYPE html>
<html class="has-background-light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StoreEverything</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body>

<div th:replace="fragments/nav :: nav"></div>

<div class="container pt-6">
    <div th:with="canPublish=${#authorization.expression('hasAuthority(''PUBLISH_INFORMATION'')')}" class="columns">
        <div class="column">
            <div th:if="${!canPublish}" th:include="fragments/limited_user_warning :: warning" class="pb-2"></div>
            <div th:if="${canPublish && !userAuthorized}" th:include="fragments/unauthorized_user_warning :: warning" class="pb-2"></div>
            <div th:if="${canPublish && userAuthorized}" class="card" >
                <div class="card-header">
                    <div class="card-header-title">
                        Delete information
                    </div>
                </div>
                <form th:object="${information}"  class="card-content" method="post">
                    <div class="columns">
                        <div class="field column">
                            <p>Are you sure you want to delete this information?</p>
                        </div>
                    </div>
                    <div class="card-footer">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="submit" class="card-footer-item" value="Delete">
                        <a href="/information/by-me" class="card-footer-item">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
        <div class="column is-one-third">
            <div class="panel">
                <p class="panel-heading">
                    Shared with me
                </p>
                <div class="panel-block">

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
