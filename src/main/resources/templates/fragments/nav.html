<!DOCTYPE html>
<html xmlns:sec="http://www.w3.org/1999/xhtml">
<body>
<nav th:fragment="nav" class="navbar is-transparent">
    <div class="navbar-brand">
        <a class="navbar-item" href="/">
            Store Everything
        </a>
        <div class="navbar-burger" data-target="navbar-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div class="navbar-brand">
        <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/list}" class="navbar-item" href="/">
            Show users
        </a>
        <div class="navbar-burger" data-target="navbar-menu">
        </div>
    </div>

    <div th:with="canAddCategory=${#authorization.expression('hasAuthority(''ADD_CATEGORY'')')}" class="navbar-brand">
        <a th:if="${canAddCategory}" th:href="@{/categories/new}" class="navbar-item">
           Add category
        </a>
    </div>

    <div id="navbar-menu" class="navbar-menu">
        <div class="navbar-start">
            <a th:if="${#httpServletRequest.remoteUser}" class="navbar-item" th:href="@{/information/by-me}">
                Information list
            </a>
        </div>

        <div class="navbar-end">
            <div class="navbar-item">
                <div class="buttons">
                    <a th:unless="${#httpServletRequest.remoteUser}" th:href="@{/register}" class="button is-primary">
                        <strong>Sign up</strong>
                    </a>
                    <a th:unless="${#httpServletRequest.remoteUser}" th:href="@{/login}" class="button is-light">
                        Log in
                    </a>
                    <form th:if="${#httpServletRequest.remoteUser}" th:action="@{/logout}" method="post">
                        <input type="submit" value="Log out" class="button is-light" />
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
