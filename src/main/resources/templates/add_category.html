<!DOCTYPE html>
<html class="has-background-light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StoreEverything</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body>

<div th:replace="fragments/nav :: nav"></div>


<div th:with="canAddCategory=${#authorization.expression('hasAuthority(''ADD_CATEGORY'')')}" class="container pt-6">
    <div class="message is-primary" th:if="${categoryAddedSuccessful == true}">
        <div class="message-header">
            <p>Successful adding category </p>
        </div>

        <div class="message-body">
            The category has been added and can be used in creating the information
        </div>
    </div>

        <div class="card">
            <div class="card-header">
                <div class="card-header-title">
                    Category
                </div>
            </div>

            <form th:object="${category}" th:action="@{/categories/new}" class="card-content" method="post">
                <div class="field">
                    <label class="label">Name<sup class="has-text-danger is-size-7">*</sup></label>
                    <div class="control">
                        <input th:disabled="${!canAddCategory}" th:field="*{name}" class="input" type="text"
                               placeholder="Name">
                    </div>

                    <p th:each="error: ${#fields.errors('name')}" th:text="${error}" class="help is-danger"></p>
                </div>

                <div class="card-footer">
                    <input th:if="${canAddCategory}" type="submit" class="card-footer-item button is-primary"
                           value="Add">
                </div>
            </form>
    </div>

</div>
</body>
</html>
