<!DOCTYPE html>
<html class="has-background-light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StoreEverything</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body>

<div th:replace="fragments/nav :: nav"></div>

<div class="container pt-6">
<div class="columns">
    <div class="column">
        <div class="card">
            <div class="card-header">
                <div class="card-header-title">
                    Share information
                </div>
            </div>
            <form class="card-content">
                <div class="columns">
                    <div class="field column">
                        <label class="label">Title<sup class="has-text-danger is-size-7">*</sup></label>
                        <div class="control">
                            <input class="input" type="text" placeholder="Title">
                        </div>
                    </div>

                    <div class="field column is-narrow">
                        <label class="label">Category</label>
                        <div class="control">
                            <div class="select">
                                <select>
                                    <option th:each="category: ${categories}" th:text="${category.name}" th:value="${category.id}"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="field">
                    <label class="label">Content<sup class="has-text-danger is-size-7">*</sup></label>
                    <div class="control">
                        <textarea class="textarea" placeholder="Content"></textarea>
                    </div>
                </div>

                <div class="field">
                    <label class="label">Link</label>
                    <div class="control">
                        <input class="input" type="text" placeholder="https://wvffle.net">
                    </div>
                </div>


            </form>
            <div class="card-footer">
                <a href="#" class="card-footer-item">Share</a>
            </div>
        </div>
    </div>
    <div class="column is-one-third">
        <div class="panel">
            <p class="panel-heading">
                Shared with me
            </p>
            <div class="panel-block">

            </div>
        </div>
    </div>
</div>
</div>
</body>
</html>
