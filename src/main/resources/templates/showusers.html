<!DOCTYPE html>
<html class="has-background-light" xmlns:modelAttribute="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StoreEverything</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body>

<div th:replace="fragments/nav :: nav"></div>

<section class="hero is-primary">
    <div class="hero-body">
      <div class="container">
        <h1 class="title">
          Show users
        </h1>
      </div>
  </div>

</section>
<div class="is-centered level-item">
  <table class="table">
    <thead>
    <tr>
      <th class="title">ID</th>
      <th class="title">Username</th>
      <th class="title">First name</th>
      <th class="title">Last name</th>
      <th class="title">Age</th>
      <th class="title">Role</th>
    </tr>
    </thead>
    <tbody>
      <tr th:each="user, idx: ${users}">
          <td th:text="${user.id}"></td>
          <td th:text="${user.username}"></td>
          <td th:text="${user.firstName}"></td>
          <td th:text="${user.lastName}"></td>
        <td th:text="${user.age}"></td>
        <form th:action="@{/changerole/{user}/{role}(user=${user.id}, role=${user.role})}" method="POST">
          <td>
              <select >
                <option th:value="${user.role}" th:text="'limited_user'" th:selected="${user.role == 'limited_user'}"></option>
                <option th:value="${user.role}" th:text="'user'" th:selected="${user.role == 'user'} "></option>
                <option th:value="${user.role}" th:text="'admin'" th:selected="${user.role == 'admin'}"></option>
              </select>
          </td>
          <td>
            <button class="button is-primary" type="submit" value="changerole">Submit</button>
          </td>
        </form>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
