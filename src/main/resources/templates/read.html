<!DOCTYPE html>
<html class="has-background-light" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StoreEverything</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body>

<div th:replace="fragments/nav :: nav"></div>

<section class="hero is-primary">
    <div class="hero-body">
        <div class="container">
            <h1 class="title">
               Show information
            </h1>
        </div>
    </div>

</section>
<div class="is-centered level-item">
    <table class="table">
        <thead>
        <tr>
            <th class="title">ID</th>
            <th class="title">Title</th>
            <th class="title">Author</th>
            <th class="title">Category</th>
            <th class="title">Date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="info: ${information}">
            <div th:object="${info}" th:with="authorUserName=*{author.username}">
                <th th:text="${info.id}"></th>
                <th th:text="${info.title}"></th>
                <th th:text="*{author.username}"></th>
                <th th:text="*{category.name}"></th>
                <th th:text="${info.created_at}"></th>
                <th>
                    <a th:href="@{/read/{id}(id=${info.id})}" class="button is-primary">Show</a>
                </th>

                <div sec:authorize="isAuthenticated()" th:with="currentUserName=${#authentication.name}">
                    <th th:if="${currentUserName == authorUserName}">
                        <a th:href="@{/read/{id}(id=${info.id})}" class="button is-primary">Edit</a>
                    </th>
                    <th th:if="${currentUserName == authorUserName}">
                        <a th:href="@{/read/{id}(id=${info.id})}" class="button is-primary">Delete</a>
                    </th>
                </div>
            </div>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
